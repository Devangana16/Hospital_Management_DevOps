
name: Hospital API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: "ci-only-test-secret-not-for-production"
      APP_ENV: test
      DATABASE_URL: "sqlite:///./test_hospital.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff pip-audit

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Check Python formatting
        run: ruff format --check app tests

      - name: Run linting
        run: ruff check app tests

      - name: Run automated tests
        run: pytest -v

      - name: Security audit
        run: pip-audit

      - name: Build Docker image
        run: |
          docker build -t hospital-appointment-api:${{ github.sha }} .
          docker tag hospital-appointment-api:${{ github.sha }} hospital-appointment-api:latest
